# ---------------------------------------------------------------------------
# 知墨图书馆 · Nginx 部署示例
#
# 该文件仅作为生产部署参考，本地开发无需启动 Nginx：
#   frontend  npm run dev        -> Vite 将 /api 代理到 http://localhost:8080
#   backend   mvn spring-boot:run
#
# 使用方式：
#   1. npm run build，将 frontend/dist 上传到 /usr/share/nginx/html/libraryms
#   2. 修改 server_name 与 proxy_pass 后放入 /etc/nginx/conf.d/libraryms.conf
#   3. nginx -t && nginx -s reload
# ---------------------------------------------------------------------------

upstream libraryms_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name library.example.edu.cn;

    root /usr/share/nginx/html/libraryms;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    # 静态资源：带 hash 的文件可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API 反向代理：保留 /api 前缀，后端控制器统一使用 /api 前缀。
    location /api/ {
        proxy_pass http://libraryms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Vue Router history 模式 fallback：
    # 任意前端路由都回退到 index.html，由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # index.html 不缓存，避免发布后浏览器继续使用旧资源清单。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 基础安全响应头，可按学校实际安全规范调整。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_vary on;
}
