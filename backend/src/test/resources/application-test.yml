spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:libraryms_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql
      encoding: UTF-8

app:
  jwt:
    secret: test-only-secret-key-0123456789-0123456789
